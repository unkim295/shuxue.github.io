<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖南永州·中考数学总复习知识大纲系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 顶部导航 -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">湖南统考（永州）中考数学总复习体系</h1>
                    <p class="text-xs text-indigo-200">15年教研组长重构版 · 专题化大模块推进平台</p>
                </div>
            </div>
            <!-- 搜索框与统计 -->
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="搜索考点/题型..." 
                           class="pl-8 pr-3 py-1.5 text-sm rounded-lg bg-indigo-800 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-xs text-indigo-300"></i>
                </div>
                <button onclick="toggleAll()" class="text-xs bg-indigo-700 hover:bg-indigo-600 px-3 py-1.5 rounded text-white transition">
                    全部展开/收起
                </button>
            </div>
        </div>
    </header>

    <!-- 进度看板 -->
    <div class="max-w-6xl mx-auto px-4 py-4 w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-full bg-indigo-50 border-2 border-indigo-500 flex items-center justify-center font-bold text-indigo-600 text-lg" id="percentText">
                    0%
                </div>
                <div>
                    <h3 class="font-semibold text-slate-800">总复习通关进度</h3>
                    <p class="text-xs text-slate-500">共 18 核心专题 · 48 个高频微考点</p>
                </div>
            </div>
            <div class="w-full sm:w-1/2">
                <div class="w-full bg-slate-100 rounded-full h-3">
                    <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主目录展示区 -->
    <main class="max-w-6xl mx-auto px-4 pb-12 flex-1 w-full" id="modulesContainer">
        <!-- JS 动态渲染目录结构 -->
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        湖南省统考初中学业水平考试数学复习教研组专用 · 待审大纲版
    </footer>

    <script>
        // 大纲核心数据
        const syllabusData = [
            {
                id: "M1",
                title: "模块一：数与代数基础模型的重构与变式",
                badge: "基础高频 (约25分)",
                color: "indigo",
                topics: [
                    { name: "专题 1：实数概念深化与代数式的综合运算", items: ["1.1 绝对值化简、科学记数法与估值技巧", "1.2 乘法公式逆用、配方法与因式分解高阶", "1.3 二次根式性质、无理数求值与分母有理化"] },
                    { name: "专题 2：分式的化简求值与不等式（组）的参变量分类", items: ["2.1 分式化简-求值（自选值/条件值）规范模型", "2.2 含参一元一次不等式组解集分类（整数解分类讨论）"] },
                    { name: "专题 3：方程与方程组的建模与实际应用", items: ["3.1 一元二次方程判别式与韦达定理应用", "3.2 分式方程增根分析与实际应用题（工效/行程）", "3.3 现实生活情境建模（方案最优化选择）"] }
                ]
            },
            {
                id: "M2",
                title: "模块二：函数建模、图象变换与综合应用",
                badge: "中考核心 (约28分)",
                color: "blue",
                topics: [
                    { name: "专题 4：一次函数与反比例函数的交叉综合", items: ["4.1 一次函数图象性质、交点坐标及动点面积", "4.2 反比例函数 k 的几何意义与割补法面积模型", "4.3 一次与反比例函数交点问题与不等式图象法"] },
                    { name: "专题 5：二次函数的解析表达与性质深拓", items: ["5.1 二次函数三类解析式确定与特征转化", "5.2 二次函数图象特征与 a, b, c 综合判定", "5.3 对称轴增减性与二次函数闭区间最值模型"] },
                    { name: "专题 6：函数应用与现实建模问题", items: ["6.1 实体建筑轨迹抛物线建系与解析方程", "6.2 利润最大化二次函数分段与极值模型"] }
                ]
            },
            {
                id: "M3",
                title: "模块三：基础几何性质与全等判定",
                badge: "推理论证 (约16分)",
                color: "emerald",
                topics: [
                    { name: "专题 7：三角形与多边形角边骨架", items: ["7.1 平行线与特殊角计算、等腰三角形多解分类", "7.2 直角三角形勾股定理及折叠展开求线段长"] },
                    { name: "专题 8：全等三角形基础模型与辅助线构造", items: ["8.1 倍长中线模型与截长补短辅助线", "8.2 手拉手模型与角平分线四大构造模型"] }
                ]
            },
            {
                id: "M4",
                title: "模块四：四边形性质探究与特殊判定",
                badge: "几何变换 (约15分)",
                color: "teal",
                topics: [
                    { name: "专题 9：平行四边形与中点网络", items: ["9.1 平行四边形性质综合与对角线中心对称", "9.2 三角形中位线、中点四边形与斜边中线"] },
                    { name: "专题 10：矩形、菱形与正方形的性质转化与判定", items: ["10.1 矩形与菱形性质综合与折叠变式", "10.2 正方形中十字架模型、半角模型与弦图模型"] }
                ]
            },
            {
                id: "M5",
                title: "模块五：相似变换与圆的性质综合",
                badge: "综合核心 (约18分)",
                color: "amber",
                topics: [
                    { name: "专题 11：相似三角形核心几何模型", items: ["11.1 A字形、8字形与平行线分线段成比例", "11.2 射影定理（双直角）与一线三等角模型", "11.3 旋转相似与位似图形判定"] },
                    { name: "专题 12：圆的几何性质与切线证明", items: ["12.1 垂径定理、圆周角及圆内接四边形对角互补", "12.2 切线判定策略（连半径证垂直/作垂直证半径）", "12.3 切线长定理、内外切圆与隐圆构造"] },
                    { name: "专题 13：圆中的度量计算与位置关系", items: ["13.1 弧长、扇形面积及圆锥侧面展开图计算", "13.2 阴影部分面积割补与重叠图形转化"] }
                ]
            },
            {
                id: "M6",
                title: "模块六：统计、概率与跨学科/新考向",
                badge: "素养新题 (约12分)",
                color: "purple",
                topics: [
                    { name: "专题 14：统计图表与数据代表性指标", items: ["14.1 条形/扇形图联合提取与样本估计总体", "14.2 平均数、中位数、众数与方差决策应用"] },
                    { name: "专题 15：概率计算与游戏公平性", items: ["15.1 列表法与树状图法求概率", "15.2 跨学科情境概率模型（物理电路/生物遗传）"] },
                    { name: "专题 16：新定义阅读理解与操作探究型小题", items: ["16.1 定义新运算与新几何性质迁移探究", "16.2 尺规作图原理与命题推理验证"] }
                ]
            },
            {
                id: "M7",
                title: "模块七：中考压轴破局专项（湖南统考第 24、25 题定向冲刺）",
                badge: "压轴冲顶 (约16分)",
                color: "rose",
                topics: [
                    { name: "专题 17：几何动态变换与存在性探究（几何压轴）", items: ["17.1 动点引起的特殊三角形（等腰/直角）存在性", "17.2 动点引起的特殊四边形存在性问题", "17.3 旋转变换下线段最值（阿氏圆/胡不归模型）"] },
                    { name: "专题 18：二次函数与几何图形代数综合（函数压轴）", items: ["18.1 抛物线动点三角形面积最值（铅垂高法）", "18.2 二次函数背景下线段和差最值（将军饮马）", "18.3 抛物线中特殊角度（相等角/特殊角）代数化转法"] }
                ]
            }
        ];

        // 渲染页面大纲
        function renderSyllabus() {
            const container = document.getElementById('modulesContainer');
            container.innerHTML = '';

            syllabusData.forEach((mod, modIdx) => {
                const modCard = document.createElement('div');
                modCard.className = "mb-4 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
                
                let topicsHtml = mod.topics.map((t, tIdx) => {
                    let itemsHtml = t.items.map((item, itemIdx) => {
                        const itemId = `${mod.id}_${tIdx}_${itemIdx}`;
                        return `
                            <label class="flex items-center space-x-3 p-2 rounded-lg hover:bg-slate-50 cursor-pointer text-sm text-slate-700 transition">
                                <input type="checkbox" id="${itemId}" onchange="updateProgress()" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 border-slate-300">
                                <span>${item}</span>
                            </label>
                        `;
                    }).join('');

                    return `
                        <div class="mb-3 border-l-2 border-slate-200 pl-4">
                            <h4 class="font-medium text-slate-800 text-sm mb-1">${t.name}</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-1">
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                modCard.innerHTML = `
                    <div class="p-4 bg-slate-50/70 border-b border-slate-100 flex items-center justify-between cursor-pointer select-none" onclick="toggleModule('${mod.id}')">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-200 text-sm" id="icon_${mod.id}"></i>
                            <h2 class="font-bold text-slate-800 text-base">${mod.title}</h2>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-slate-200 text-slate-700 font-medium">${mod.badge}</span>
                    </div>
                    <div id="content_${mod.id}" class="p-4 block">
                        ${topicsHtml}
                    </div>
                `;
                container.appendChild(modCard);
            });

            loadSavedProgress();
        }

        // 展开/折叠单模块
        function toggleModule(id) {
            const content = document.getElementById(`content_${id}`);
            const icon = document.getElementById(`icon_${id}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(-90deg)';
            }
        }

        // 全部展开/收起
        let isAllExpanded = true;
        function toggleAll() {
            isAllExpanded = !isAllExpanded;
            syllabusData.forEach(mod => {
                const content = document.getElementById(`content_${mod.id}`);
                const icon = document.getElementById(`icon_${mod.id}`);
                if (isAllExpanded) {
                    content.classList.remove('hidden');
                    icon.style.transform = 'rotate(0deg)';
                } else {
                    content.classList.add('hidden');
                    icon.style.transform = 'rotate(-90deg)';
                }
            });
        }

        // 进度追踪与本地存储
        function updateProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            let checked = 0;
            const state = {};
            checkboxes.forEach(cb => {
                state[cb.id] = cb.checked;
                if (cb.checked) checked++;
            });
            const percent = Math.round((checked / checkboxes.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').innerText = percent + '%';
            localStorage.setItem('yz_math_review_progress', JSON.stringify(state));
        }

        function loadSavedProgress() {
            const saved = localStorage.getItem('yz_math_review_progress');
            if (!saved) return;
            const state = JSON.parse(saved);
            Object.keys(state).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.checked = state[id];
            });
            updateProgress();
        }

        // 关键字过滤搜索
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            const cards = document.querySelectorAll('#modulesContainer > div');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // 初始化
        window.onload = renderSyllabus;
    </script>
</body>
</html>
