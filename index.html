                drawer.classList.remove('translate-x-full');
            }, 10);
            document.body.style.overflow = 'hidden';

            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('drawerBody')]);
            }
        }

        function closeDrawer() {
            const drawer = document.getElementById('detailDrawer');
            const overlay = document.getElementById('drawerOverlay');

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-x-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        function toggleModule(id) {
            const content = document.getElementById(`content_${id}`);
            const icon = document.getElementById(`icon_${id}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(-90deg)';
            }
        }

        let isAllExpanded = true;
        function toggleAllModules() {
            isAllExpanded = !isAllExpanded;
            modulesList.forEach(mod => {
                const content = document.getElementById(`content_${mod.id}`);
                const icon = document.getElementById(`icon_${mod.id}`);
                if (isAllExpanded) {
                    content.classList.remove('hidden');
                    icon.style.transform = 'rotate(0deg)';
                } else {
                    content.classList.add('hidden');
                    icon.style.transform = 'rotate(-90deg)';
                }
            });
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            let checked = 0;
            const state = {};
            checkboxes.forEach(cb => {
                state[cb.id] = cb.checked;
                if (cb.checked) checked++;
            });
            const percent = Math.round((checked / checkboxes.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').innerText = percent + '%';
            localStorage.setItem('yz_math_review_drawer_progress', JSON.stringify(state));
        }

        function loadSavedProgress() {
            const saved = localStorage.getItem('yz_math_review_drawer_progress');
            if (!saved) return;
            const state = JSON.parse(saved);
            Object.keys(state).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.checked = state[id];
            });
            updateProgress();
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            const cards = document.querySelectorAll('#modulesContainer > div');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDrawer();
        });

        window.onload = renderApp;
    </script>
</body>
</html>
